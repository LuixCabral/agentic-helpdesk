[project]
name = "poc-bug-with-ai"
version = "0.1.0"
description = "PoC: AI agent that automatically opens Jira bugs via MCP"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "agno>=1.7.0",
    "google-genai>=1.0.0",
    "fastmcp>=2.0.0",
    "jira>=3.8.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.13.4",
    "huggingface-hub>=1.28.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "psycopg[binary,pool]>=3.2.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "notion-client>=2.2.1",
    "openai>=1.0.0",
    "slowapi>=0.1.9",
    "redis>=5.0.0",
    "pydantic-settings>=2.15.0",
    "bcrypt>=5.0.0",
]
